plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}


version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
    maven { url = 'https://jitpack.io' }
    maven { url = "https://maven.fallenbreath.me/releases" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:26.2-SNAPSHOT"

    // Litematica TODO: make it not error on compile?
    implementation fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}
tasks.register('printVersion') {
    doLast {
        println(project.version)
    }
}
tasks.register('printMCVersion') {
    doLast {
        println(project.minecraft_version)
    }
}
